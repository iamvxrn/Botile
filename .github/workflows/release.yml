name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    if: ${{ ! github.event.forced }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check and package
        run: |
          python3 -m py_compile Botile.plugin
          python3 scripts/package_release.py --check
          python3 tests/test_state_preservation.py
          python3 scripts/package_release.py --tag "$GITHUB_REF_NAME" --output-dir dist
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Botile ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            "dist/Botile-${GITHUB_REF_NAME#v}.plugin" \
            "dist/SHA256SUMS"
