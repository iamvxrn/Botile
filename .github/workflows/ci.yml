name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Syntax and host-side checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Check plugin
        run: |
          python3 -m py_compile Botile.plugin
          python3 scripts/package_release.py --check
          python3 tests/test_state_preservation.py
          python3 scripts/package_release.py --output-dir /tmp/botile-dist
          (cd /tmp/botile-dist && sha256sum -c SHA256SUMS)
