name: Bug report
description: Report a Botile plugin, documentation, or release problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove tokens, phone numbers, chat IDs,
        and other personal data from logs and screenshots before submitting.
        Security vulnerabilities should be reported privately; see SECURITY.md.

  - type: input
    id: botile-version
    attributes:
      label: Botile version
      description: The version shown in the plugin log or `__version__`.
      placeholder: "1.1.3"
    validations:
      required: true

  - type: input
    id: exteraless-version
    attributes:
      label: Exteraless build and SDK
      description: App version, commit, and plugin SDK version.
      placeholder: "12.10.6-00c14f4, SDK 1.4.5.3"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true

  - type: dropdown
    id: hooks
    attributes:
      label: Java hooks permission and trusted level
      options:
        - Enabled and trusted
        - Enabled but not trusted
        - Disabled
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal, repeatable sequence.
      placeholder: |
        1. Open ...
        2. Scroll to ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Botile logcat
      description: Include the Botile startup line, hook lines, and the first error.
      render: shell
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag files here after redacting personal data.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I removed secrets, tokens, phone numbers, chat IDs, and personal data.
          required: true
        - label: I checked the known limitations in README.md and VALIDATION.md.
          required: true
        - label: This is not a private security report.
          required: true
